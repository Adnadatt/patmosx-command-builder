<script>
    const baseURL = "http://tyr.ssec.wisc.edu/patmosx_l2bc/"
    let command = ""

    function getChecked(listID) {
        return [...document.querySelectorAll(`#${listID} input:checked`)].map(cb => cb.value);
    }

    function updateCommand() {
        command = "";
        let products = getChecked('cloudProd-list');
        let satellites = getChecked('satellite-list');
        let startDate = document.getElementById('startDate').value;
        let endDate = document.getElementById('endDate').value;
        let message = document.getElementById('message');
        message.textContent = "";

        if (startDate && endDate && startDate > endDate) {
            message.textContent = "Error: Start date must be on or before end date.";
            return;
        }

        if (!products.length) {
            message.textContent = "Error: Please select at least one product.";
            return;
        }

        if (!satellites.length) {
            message.textContent = "Error: Please select at least one satellite.";
            return;
        }
        

        command = `curl ${baseURL}index.txt`; // 

        command += ` | grep -E '\\.(${products.join('|')})\\.nc'`;
        command += ` | grep -E '_(${satellites.join('|')})_'`;

        if (startDate || endDate) {
            const s = (startDate || "00000000").replace(/-/g, ""); // get startDate, replace dashes with ""
            const e = (endDate || "99999999").replace(/-/g, "");
            const digits = "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]"; // awk pattern for eight digits
            command += ` | awk 'match($0, /_d${digits}/) { d = substr($0, RSTART+2, 8); if (d >= "${s}" && d <= "${e}") print }'`
        }

        command += ` | wget -nc -nH -x --base=${baseURL} -i -`;

        document.getElementById('commandOutput').innerText = command;
    }

    let copyTimeout;

    async function copyCommand() {
        if (!command) updateCommand();
        if (!command) return; // If still no command, do nothing

        const copyBtn = document.getElementById('copyBtn');
        clearTimeout(copyTimeout); // handles rapid repeated clicks

        try {
            await navigator.clipboard.writeText(command);
            copyBtn.textContent = "Copied!";
            copyBtn.classList.add('copied');
        } catch (err) {
            console.error('Failed to copy: ', err);
        }

        copyTimeout = setTimeout(() => {
            copyBtn.textContent = "Copy to Clipboard";
            copyBtn.classList.remove('copied');
        }, 1500);
    }
</script>
