<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patmos-x Curl Download Builder</title>

<style>
    :root {
        --font-size:16px;
        --font-size-small:14px;
        --border: 1px solid #464646;
        --radius: 5px;
        --control-height: 34px;
    }

    body { font-family: system-ui, sans-serif; font-size:var(--font-size); max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    button, input, select { font:inherit; }

    .selections { display: flex; flex-direction: row; flex-wrap: wrap; justify-content:center; align-items:center; gap: 20px; margin-bottom: 2rem; }
    .selector { display:flex; flex-direction:column; gap: 5px; width:300px; }
    .date-col { display:flex; flex-direction:column; gap: 10px; width:200px }
    .date-col .selector { width:100%; }
    .btn-row { display:flex; flex-direction:row; gap:15px; margin-bottom:1rem;}
    
    .selectClearAll { background:none; border:none; cursor:pointer; color: #003063; font-size:var(--font-size-small); padding:4px 6px; }
    .selectClearAll:hover { text-decoration: underline; }

    .multisel-row { 
        display:flex; cursor:pointer; border-bottom: 1px solid #f0f0f0; 
        padding: 5px 5px; gap:13px; align-items:center; font-size:var(--font-size);
    }
    .multisel-row:last-child { border-bottom: none; }

    .checklist {
        height:180px; overflow-y:auto; border:var(--border); border-radius:var(--radius);
    }
    .checklist::-webkit-scrollbar {
        width: 9px;
    }
    .checklist::-webkit-scrollbar-track {
        background: #f4f4f4;
    }
    .checklist::-webkit-scrollbar-thumb {
        background: #dddddd;
        border-radius:var(--radius);
    }
    .checklist::-webkit-scrollbar-thumb:hover {
        background: #cccccc;
    }

    input[type="date"] {
        height: var(--control-height);
        width: 100%;
        padding: 0 8px;
        box-sizing: border-box;
        border: var(--border);
        border-radius: var(--radius);
        font-size: var(--font-size);
    }

    .btn {
        height: 30px;
        font-size: var(--font-size-small);
        padding: 0 12px;
        border: 1px solid #b0b0b0;
        border-radius: var(--radius);
        background: #f4f4f4;
        cursor: pointer;
    }
    .btn:hover { background: #e8e8e8; }

    #copyBtn.copied {
        background-color: #2e7d32;
        color: white;
    }

    pre { font-size:var(--font-size-small); background:#dddddd; padding:1rem; border-radius:5px; white-space:pre-wrap; word-break:break-all; }
    .error { color: #b00020; }

</style>
</head>

<body>
    <h1>Patmos-x Curl Command Builder</h1>



    <div style="max-width: 100%; margin: 0 auto;">
        <!-- This inner wrapper matches the 80% width and centers everything together -->
        <div style="width: 80%; margin: 0 auto;">
            <h3 style="margin-bottom: 0px; text-align: left;">Satellite Active Timelines</h3>
            <img src="images/satelliteTimeline.png" alt="Satellite Timeline" style="width: 100%; display: block;"/>
            <p style="text-align: center;"><i>Note: The timeline above shows the active periods of the satellites.</i></p>
        </div>
    </div>

    <br>
    <div class="selections">
        <!-- selection for cloud product -->
        <div class="selector">
            <label>Choose Cloud Product(s)</label>

            <div class="checklist" id="cloudProd-list">
                <label class="multisel-row"><input type="checkbox" value="cld_emiss_acha">Cloud Emissivity</label>
                <label class="multisel-row"><input type="checkbox" value="cld_opd_dcomp">Cloud Optical Depth</label>
                <label class="multisel-row"><input type="checkbox" value="cld_press_acha">Cloud Pressure</label>
                <label class="multisel-row"><input type="checkbox" value="cld_reff_dcomp">Cloud Effective Radius</label>
                <label class="multisel-row"><input type="checkbox" value="cld_temp_acha">Cloud Temperature</label>
                <label class="multisel-row"><input type="checkbox" value="cld_temp_lower_acha">Cloud Temperature (Lower)</label>
                <label class="multisel-row"><input type="checkbox" value="cloud_fraction">Cloud Fraction</label>
                <label class="multisel-row"><input type="checkbox" value="cloud_probability">Cloud Probability</label>
                <label class="multisel-row"><input type="checkbox" value="cloud_type">Cloud Type</label>
                <label class="multisel-row"><input type="checkbox" value="datetime">Date/Time</label>
                <label class="multisel-row"><input type="checkbox" value="ice_cloud_probability">Ice Cloud Probability</label>
                <label class="multisel-row"><input type="checkbox" value="land_class">Land Class</label>
                <label class="multisel-row"><input type="checkbox" value="refl_0_65um_nom">Reflectance (0.65 μm)</label>
                <label class="multisel-row"><input type="checkbox" value="refl_0_65um_nom_counts">Reflectance (0.65 μm) - Counts</label>
                <label class="multisel-row"><input type="checkbox" value="refl_0_86um_nom">Reflectance (0.86 μm)</label>
                <label class="multisel-row"><input type="checkbox" value="refl_0_86um_nom_counts">Reflectance (0.86 μm) - Counts</label>
                <label class="multisel-row"><input type="checkbox" value="refl_1_60um_nom">Reflectance (1.60 μm)</label>
                <label class="multisel-row"><input type="checkbox" value="refl_1_60um_nom_counts">Reflectance (1.60 μm) - Counts</label>
                <label class="multisel-row"><input type="checkbox" value="relative_azimuth_angle">Relative Azimuth Angle</label>
                <label class="multisel-row"><input type="checkbox" value="scan_line_time">Scan Line Time</label>
                <label class="multisel-row"><input type="checkbox" value="scattering_angle">Scattering Angle</label>
                <label class="multisel-row"><input type="checkbox" value="sensor_azimuth_angle">Sensor Azimuth Angle</label>
                <label class="multisel-row"><input type="checkbox" value="sensor_zenith_angle">Sensor Zenith Angle</label>
                <label class="multisel-row"><input type="checkbox" value="snow_class">Snow Class</label>
                <label class="multisel-row"><input type="checkbox" value="solar_azimuth_angle">Solar Azimuth Angle</label>
                <label class="multisel-row"><input type="checkbox" value="solar_zenith_angle">Solar Zenith Angle</label>
                <label class="multisel-row"><input type="checkbox" value="surface_pressure_nwp">Surface Pressure (NWP)</label>
                <label class="multisel-row"><input type="checkbox" value="temp_11_0um_nom">Temperature (11.0 μm)</label>
                <label class="multisel-row"><input type="checkbox" value="temp_11_0um_nom_clear_sky">Temperature (11.0 μm) - Clear Sky</label>
                <label class="multisel-row"><input type="checkbox" value="temp_11_0um_nom_sounder">Temperature (11.0 μm) - Sounder</label>
                <label class="multisel-row"><input type="checkbox" value="temp_11_0um_nom_stddev_3x3">Temperature (11.0 μm) - Standard Deviation (3x3)</label>
                <label class="multisel-row"><input type="checkbox" value="temp_12_0um_nom">Temperature (12.0 μm)</label>
                <label class="multisel-row"><input type="checkbox" value="temp_13_3um_nom">Temperature (13.3 μm)</label>
                <label class="multisel-row"><input type="checkbox" value="temp_13_3um_nom_clear_sky">Temperature (13.3 μm) - Clear Sky</label>
                <label class="multisel-row"><input type="checkbox" value="temp_3_75um_nom">Temperature (3.75 μm)</label>
                <label class="multisel-row"><input type="checkbox" value="temp_3_75um_nom_sounder">Temperature (3.75 μm) - Sounder</label>
                <label class="multisel-row"><input type="checkbox" value="water_cloud_probability">Water Cloud Probability</label>
            </div>

            <div>
                <button class="selectClearAll" onclick="selectAll('cloudProd-list')">Select All</button>
                <button class="selectClearAll" onclick="clearAll('cloudProd-list')">Clear All</button>
            </div>
        </div>

        <!-- selection for satellite -->
        <div class="selector">
            <label>Choose Satellite(s)</label>
            <div class="checklist" id="satellite-list">
                <label class="multisel-row"><input type="checkbox" value="METOP-A">Metop-A</label>
                <label class="multisel-row"><input type="checkbox" value="METOP-B">Metop-B</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-06">NOAA-06</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-07">NOAA-07</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-08">NOAA-08</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-09">NOAA-09</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-10">NOAA-10</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-11">NOAA-11</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-12">NOAA-12</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-13">NOAA-13</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-14">NOAA-14</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-15">NOAA-15</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-16">NOAA-16</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-17">NOAA-17</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-18">NOAA-18</label>
                <label class="multisel-row"><input type="checkbox" value="NOAA-19">NOAA-19</label>
            </div>

            <div>
                <button class="selectClearAll" onclick="selectAll('satellite-list')">Select All</button>
                <button class="selectClearAll" onclick="clearAll('satellite-list')">Clear All</button>
            </div>
        </div>

        <!-- selection for date range -->
         <div class="date-col">
            <div class="selector">
                <label>Start Date</label>
                <input type="date" id="startDate" value="1980-01-24" min="1980-01-24">
            </div>
            <div class="selector">
                <label>End Date</label>
                <input type="date" id="endDate" value="2026-01-01" min="1980-01-24">
            </div>
         </div>
     </div>

     <div class="btn-row">
        <button class="btn" onclick="updateCommand()">Generate Command</button>

        <button class="btn" id="copyBtn" onclick="copyCommand()">Copy to Clipboard</button>
    </div>

    <p id="message" class="error"></p>
    <pre id="commandOutput">Your command will appear here.</pre>


<script>
    const baseURL = "http://tyr.ssec.wisc.edu/patmosx_l2bc/"
    let command = ""

    function selectAll(listID) {
        document.querySelectorAll(`#${listID} input`).forEach(cb => cb.checked = true);
    }

    function clearAll(listID) {
        document.querySelectorAll(`#${listID} input`).forEach(cb => cb.checked = false);
    }

    function getChecked(listID) {
        return [...document.querySelectorAll(`#${listID} input:checked`)].map(cb => cb.value);
    }

    function updateCommand() {
        command = "";
        let products = getChecked('cloudProd-list');
        let satellites = getChecked('satellite-list');
        let startDate = document.getElementById('startDate').value;
        let endDate = document.getElementById('endDate').value;
        let message = document.getElementById('message');
        message.textContent = "";

        if (startDate && endDate && startDate > endDate) {
            message.textContent = "Error: Start date must be on or before end date.";
            return;
        }

        if (!products.length) {
            message.textContent = "Error: Please select at least one product.";
            return;
        }

        if (!satellites.length) {
            message.textContent = "Error: Please select at least one satellite.";
            return;
        }
        

        command = `curl ${baseURL}index.txt`; // 

        command += ` | grep -E '\\.(${products.join('|')})\\.nc'`;
        command += ` | grep -E '_(${satellites.join('|')})_'`;

        if (startDate || endDate) {
            const s = (startDate || "00000000").replace(/-/g, ""); // get startDate, replace dashes with ""
            const e = (endDate || "99999999").replace(/-/g, "");
            const digits = "[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]"; // awk pattern for eight digits
            command += ` | awk 'match($0, /_d${digits}/) { d = substr($0, RSTART+2, 8); if (d >= "${s}" && d <= "${e}") print }'`
        }

        command += ` | wget -nc -nH -x --base=${baseURL} -i -`;

        document.getElementById('commandOutput').innerText = command;
    }

    let copyTimeout;

    async function copyCommand() {
        updateCommand();
        if (!command) return; // If still no command, do nothing

        const copyBtn = document.getElementById('copyBtn');
        clearTimeout(copyTimeout); // handles rapid repeated clicks

        try {
            await navigator.clipboard.writeText(command);
            copyBtn.textContent = "Copied!";
            copyBtn.classList.add('copied');
        } catch (err) {
            console.error('Failed to copy: ', err);
            copyBtn.textContent = "Copy Failed";
        }

        copyTimeout = setTimeout(() => {
            copyBtn.textContent = "Copy to Clipboard";
            copyBtn.classList.remove('copied');
        }, 1500);
    }
</script>
</body>
</html>
